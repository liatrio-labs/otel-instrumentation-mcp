---
name: Lint Python

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.10" # https://github.com/go-task/task
      
      - name: Install Task
        uses: alexellis/arkade-get@5594ddff52ec7b8a71efd73acaa9e52936e35e16 # master
        with:
          task: v3.44.0 # https://github.com/go-task/task

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24'

      - name: Run linting
        run: task lint

      - name: Check License Headers
        run: |
          task addlicense
          if ! git diff --quiet -- . ':!uv.lock'; then
            echo "Files are outdated. Changes detected."
            echo "Please run 'task addlicense' and 'task lint' locally and commit the changes."
            exit 1
          fi
