---
name: Lint Python

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      
      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.8.0" # https://github.com/go-task/task
      
      - name: Install Task
        uses: alexellis/arkade-get@master
        with:
          task: v3.44.0 # https://github.com/go-task/task

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: '1.24'

      - name: Run linting
        run: task lint

      - name: Check License Headers
        run: |
          task addlicense
          if ! git diff --quiet -- . ':!uv.lock'; then
            echo "Files are outdated. Changes detected."
            echo "Please run 'task addlicense' and 'task lint' locally and commit the changes."
            exit 1
          fi
